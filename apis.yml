aid: overflow
name: Overflow
description: >-
  Overflow is a fintech giving platform for churches and nonprofits that lets
  organizations accept and reconcile donations across many asset types — card
  and ACH, Apple Pay and Google Pay, stock, cryptocurrency, RoundUps, and
  Donor Advised Funds (DAFs) — through a single unified platform. Overflow also
  offers Overflow Tap (NFC tap-to-give hardware) and Generosity University donor
  education. Its public Overflow Open API (v3) is a REST interface over
  contributions, donors, subscriptions (recurring gifts), payments, campaigns,
  deposits, refunds, chargebacks, locations, tap devices/events, and webhooks,
  authenticated with header API keys and used to sync giving data into CRMs and
  accounting/reconciliation workflows. Overflow is backed by Uncork Capital.
