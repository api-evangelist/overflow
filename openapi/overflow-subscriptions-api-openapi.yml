                  name:
                    type: string
                required:
                - id
                - name
                nullable: true
                description: Campaign details for the contribution
                example:
                  id: 7710f34fd5061afeec3eab78
                  name: Mission 2025
              subcampaign:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                required:
                - id
                - name
                nullable: true
                description: Subcampaign details for the contribution
                example:
                  id: 7710f34fd5061afeec3eab79
                  name: Toy Drive
              metadata:
                type: object
                additionalProperties:
                  type: string
                nullable: true
                description: Merchant-defined metadata.
                example:
                  orderId: abc-123
              locationId:
                type: string
                nullable: true
                description: Id of the Location associated with the subscription.
                example: 6710f34fd5061afeec3eab57
            required:
            - id
            - donorId
            - createdAt
            - updatedAt
            - startDate
            - status
            - amount
            - anonymous
            - frequency
            - nextPaymentDate
            - paymentMethod
            - campaign
            - subcampaign
          description: List of subscriptions.
        totalCount:
          type: number
          description: Total number of subscriptions matching the filters.
          example: 100
      required:
      - data
      - totalCount
