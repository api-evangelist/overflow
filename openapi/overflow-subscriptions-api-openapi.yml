    DeleteSubscriptionRequest:
      type: object
      properties:
        cancellationReason:
          type: string
          maxLength: 150
          minLength: 1
          description: The reason for cancelling the subscription.
          example: I no longer attend this organization.
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key for API authentication
    ClientId:
