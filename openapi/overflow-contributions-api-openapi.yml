                quantity:
                  type: number
                tickers:
                  type: array
                  items:
                    type: string
              required:
              - quantity
              - tickers
              description: Stock details
              example:
                quantity: 2
                tickers:
                - AAPL
                - MSFT
            crypto:
              type:
              - object
              - 'null'
              properties:
                quantity:
                  type: number
                token:
                  type: string
              required:
              - quantity
              - token
              description: Crypto details
              example:
                quantity: 1
                token: BTC
            subscriptionId:
              type: string
              description: Subscription id for contributions related to recurring gifts
              example: 6710f34fd5061afeec3eab57
            frequency:
              type:
              - string
              - 'null'
              enum:
              - one-time
              - recurring
              description: Gift frequency
              example: one-time
            paymentMethod:
              type:
              - object
              - 'null'
              properties:
                type:
                  type: string
