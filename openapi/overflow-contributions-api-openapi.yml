openapi: 3.2.0
info:
  title: Overflow Open Contributions API
  description: 'The documentation for the Overflow Open APIs.


    To access the OpenAPI spec in JSON/YAML format, navigate to:


    * `/api/docs/openapi.json`

    * `/api/docs/openapi.yaml`'
  version: '3.0'
  contact: {}
servers:
- url: https://server.stage.overflow.co
  description: API server
tags:
- name: Contributions
paths:
  /api/v3/contributions:
    get:
      description: 'Returns contributions for the nonprofit based on the provided filters.


        ### Contribution Types

        There are 5 types of contributions representing the different asset types Overflow supports: **Cash**, **Crypto**, **DAF**, **Stock**, and **Manual** contributions. They can be differentiated by the discriminator key `type` in the response.


        ---


        ### Final Confirmation States

        A contribution is considered successful or confirmed when it reaches the following status:

        * **CASH**: `PAID_OUT`

        * **MANUAL_CASH**: `CONFIRMED`

        * **CRYPTO**: `CONFIRMED`

        * **STOCK**: `CONTRIBUTION_RECEIVED` or `BILLED`

        * **DAF**: `CONTRIBUTION_RECEIVED`


        ---


        ### Status Definitions by Asset Type


        **Cash**

        * `PENDING`: Awaiting authorization by the payment gateway.

        * `PROCESSING`: Contribution is being processed. This status only applies to ACH/Bank payments.

        * `CONFIRMED`: Contribution has been authorized by the payment gateway.

        * `PAID_OUT`: Contribution has been settled and paid out to the NPO.

        * `FAILED`: Something went wrong and the contribution was never received.

        * `VOIDED`: Contribution was voided such that it never confirmed.

        * `REFUNDED`: Contribution was refunded, typically at the request of the donor.

        * `CHARGEBACK`: Disputed by the donor or rejected by the bank.


        **Manual Cash**

        * `PENDING`: Awaiting confirmation from the NPO (currently in an open gift entry batch).

        * `CONFIRMED`: Confirmed by the NPO (gift entry batch has been closed).

        * `VOIDED`: Contribution was voided from a gift entry batch.


        **Crypto**

        * `PENDING`: Initiated by a donor but not yet sent via their wallet.

        * `CONFIRMED`: The crypto gift has been received by the NPO.

        * `PAYOUT_SENT`: The crypto gift net-funds were processed by our team.

        * `PAID_OUT`: The crypto gift has been settled and paid out to the NPO.


        **DAF (Donor Advised Funds)**

        * `INITIATED`: The DAF gift has been initiated but not yet captured.

        * `IN_PROCESS`: The DAF gift has been captured and is being sent to the NPO.

        * `CONTRIBUTION_RECEIVED`: The DAF gift has been received by the NPO.

        * `PAYOUT_SENT`: The DAF gift net-funds were processed by our team.

        * `PAID_OUT`: The DAF gift has been settled and paid out to the NPO.

        * `FAILED`: The DAF gift has failed to be captured or initiated.

        * `CANCELED` / `ABANDONED`: The DAF gift has been canceled or abandoned.


        **Stock**

        * `VERIFYING_INFORMATION`: Gathering transaction information from the donor.

        * `INITIATED`: Donor intent to give received through the platform.

        * `IN_PROCESS`: Forms sent to the sending brokerage and being processed.

        * `DONOR_BROKERAGE_SENT_SHARES`: Donor has seen shares leave their account.

        * `RECEIVED_FOR_LIQUIDATION`: Shares received by Overflow’s brokerage.

        * `LIQUIDATION_INITIATED` / `LIQUIDATION_COMPLETE`: Selling shares to lock in value.

        * `CONTRIBUTION_RECEIVED`: NPO has received the shares or liquidation cash.

        * `BILLED`: Successfully billed the client for this contribution.

        * `COMPLETED`: Client has paid the bill; gift lifecycle complete.

        * `PAYOUT_SENT` / `PAID_OUT`: Proceeds transferred and settled to the NPO.

        * `TROUBLESHOOTING` / `DONOR_UNRESPONSIVE`: Delays or loss of contact with donor.

        * `CANCELED`: Transaction never fully processed or was canceled.'
      operationId: OpenApiContributionsController_getContributions
      parameters:
      - name: limit
        required: false
        in: query
        description: The number of contributions to return.
        schema:
          minimum: 1
          maximum: 100
          default: 25
          type: number
      - name: page
        required: false
        in: query
        description: The page number of the contributions to return.
        schema:
          minimum: 1
          default: 1
          type: number
      - name: minimumUpdatedDate
        required: false
        in: query
        description: The minimum updated date of the contributions to return.
        schema:
          format: date-time
          example: '2025-01-01'
          type: string
      - name: maximumUpdatedDate
        required: false
        in: query
        description: The maximum updated date of the contributions to return.
        schema:
          format: date-time
          example: '2025-02-01'
          type: string
      - name: minimumInitiatedDate
        required: false
        in: query
        description: The minimum date the contributions were initiated to return.
        schema:
          format: date-time
          example: '2025-01-01'
          type: string
      - name: maximumInitiatedDate
        required: false
        in: query
        description: The maximum date the contributions were initiated to return.
        schema:
          format: date-time
          example: '2025-02-01'
          type: string
      - name: statusBucket
        required: false
        in: query
        description: Filter contributions by status buckets.
        schema:
          example:
          - PENDING
          - CONFIRMED
          type: array
          items:
            type: string
            enum:
            - CANCELED
            - CONFIRMED
            - PENDING
            - FAILED
      - name: campaignId
        required: false
        in: query
        description: Filter by campaign id.
        schema:
          type: string
      - name: subcampaignId
        required: false
        in: query
        description: Filter by subcampaign id.
        schema:
          type: string
      - name: locationIds
        required: false
        in: query
        description: Filter by location ids.
        schema:
          type: array
          items:
            type: string
      - name: givingLinkId
        required: false
        in: query
        description: Filter by giving link id.
        schema:
          type: string
      - name: pledgeId
        required: false
        in: query
        description: Filter by pledge id.
        schema:
          type: string
