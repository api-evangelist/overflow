    GetTapEventsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Event ID
                example: 6816f8dc7d2a1b4c12ab3522
              createdAt:
                type: string
                format: date-time
                description: When the tap event was created
                example: '2026-05-04T14:12:44.002Z'
              deviceId:
                type: string
                description: Device that was tapped
              groupId:
                type: string
                description: Group the device belonged to at time of tap
              destinationId:
                type: string
                description: Destination the tap resolved to
              device:
                type: object
                properties:
                  id:
                    type: string
                    description: Device ID
                  serialNumber:
                    type: number
                    description: Device serial number
                required:
                - id
                - serialNumber
                nullable: true
                description: Embedded device summary
              group:
                type: object
                properties:
                  id:
                    type: string
                    description: Group ID
                  name:
                    type: string
                    description: Group name
                required:
                - id
                - name
                nullable: true
                description: Embedded group summary
              destination:
                type: object
                properties:
                  id:
                    type: string
                    description: Destination ID
                  name:
                    type: string
                    description: Destination name
                  type:
                    type: string
                    enum:
                    - web
                    - sms
                    nullable: true
                    description: Destination type
                required:
                - id
                - name
                - type
                nullable: true
                description: Embedded destination summary
            required:
            - id
            - createdAt
            - deviceId
            - groupId
            - destinationId
            - device
            - group
            - destination
          description: List of tap events.
        totalCount:
          type: number
          description: Total number of tap events matching the filters.
          example: 100
      required:
      - data
      - totalCount
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key for API authentication
    ClientId:
      type: apiKey
      in: header
      name: x-client-id
      description: Client ID for API authentication
