              example: '2026-05-04T14:09:32.145Z'
            archivedAt:
              type: string
              format: date-time
              nullable: true
              description: Archive timestamp, null if active
          required:
          - id
          - serialNumber
          - deviceType
          - groupId
          - group
          - currentDestination
          - createdAt
          - updatedAt
          - archivedAt
          description: Tap device for the given id.
      required:
      - data
    GetTapDestinationByIdResponse:
      type: object
      properties:
        data:
